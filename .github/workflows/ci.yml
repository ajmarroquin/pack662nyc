name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Nothing in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # RULE 1. This runs first and independently of the build: if roster data
      # is in the tree, the run fails before anything else is worth knowing.
      - name: No roster or member data files
        run: node scripts/check-no-data-files.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
