<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pack 662">
  <!--
    Deliberately just the unit number on Scouting blue. The fleur-de-lis and
    the other Scouting America emblems are that organisation's trademarks;
    a numeral is unambiguous in a tab and raises no question about their use.
  -->
  <rect width="64" height="64" rx="12" fill="#003f87"/>
  <text
    x="32" y="33"
    text-anchor="middle" dominant-baseline="central"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="30" font-weight="700" letter-spacing="-1.5"
    fill="#ffffff">662</text>
</svg>
